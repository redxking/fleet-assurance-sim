[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-assurance-sim"
version = "0.2.0"
description = "Formal and visual simulation of secure multi-agent fleet scaling"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Angelis Pseftis"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "networkx>=3.2",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "plotly>=5.18",
  "bokeh>=3.3",
  "PyYAML>=6.0",
  "pydantic>=2.5"
]

[project.optional-dependencies]
science = ["pyarrow>=15", "SALib>=1.5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
fleet-sim = "fleet_sim.cli:main"
fleet-console = "fleet_sim.visualization.launch:main"
fleet-stage3-console = "fleet_sim.visualization.stage3_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true

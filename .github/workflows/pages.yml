name: Validate and publish public MVP

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-mvp-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate closed static release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.0"

      - name: Install frozen scientific environment and schema validator
        run: |
          python -m pip install --requirement requirements-stage3-freeze.txt jsonschema==4.25.1
          python -m pip install --no-deps --editable .
          python -c "from importlib.metadata import version; assert version('jsonschema') == '4.25.1'"

      - name: Reproduce data and verify the complete static release boundary
        run: |
          python -m pytest -q \
            tests/schema/test_public_mvp_scenario_pack.py \
            tests/integration/test_public_mvp_release_surface.py \
            tests/visualization/test_public_mvp_site.py

      - name: Upload validated Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    name: Publish validated public MVP
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Fleet Assurance Simulation research roadmap</title>
  <desc id="desc">Two evidence streams, assurance-service measurements and grounded compromise traces, pass through provenance review into a new frozen protocol, prospective held-out transfer tests, and a new evidence disposition. Operational assurance remains a separate later decision.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17324D" flood-opacity="0.11"/>
    </filter>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17324D"/>
      <stop offset="1" stop-color="#245377"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8190A0"/>
    </marker>
  </defs>

  <rect width="1600" height="760" rx="28" fill="#F5F8FB"/>
  <path d="M28 0 H1572 A28 28 0 0 1 1600 28 V112 H0 V28 A28 28 0 0 1 28 0 Z" fill="url(#header)"/>
  <text x="64" y="54" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Next research stage: stronger evidence, not more synthetic volume</text>
  <text x="64" y="86" fill="#D9E8F2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Two grounded evidence streams converge only after provenance, authority, and quality checks.</text>

  <text x="54" y="145" fill="#2E6F9E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">ADMISSION EVIDENCE</text>
  <g filter="url(#shadow)">
    <rect x="42" y="164" width="380" height="160" rx="18" fill="#FFFFFF"/>
    <rect x="42" y="164" width="10" height="160" rx="5" fill="#2E6F9E"/>
  </g>
  <circle cx="91" cy="213" r="27" fill="#E6F0F7"/>
  <path d="M78 219 V202 H104 V219 M84 202 V194 H98 V202 M84 210 H98 M91 202 V219" fill="none" stroke="#2E6F9E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="133" y="202" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Instrument assurance services</text>
  <text x="133" y="230" fill="#5D6B7A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15.5">
    <tspan x="133" dy="0">Measure work, capacity, wait budgets,</tspan>
    <tspan x="133" dy="23">priority, shedding, and recovery across</tspan>
    <tspan x="133" dy="23">the ten modeled control-plane services.</tspan>
  </text>
  <rect x="72" y="292" width="205" height="28" rx="14" fill="#E6F0F7"/>
  <text x="174" y="311" text-anchor="middle" fill="#2E6F9E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">REAL OR HIGH-FIDELITY</text>

  <text x="54" y="354" fill="#2A9D8F" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">COMPROMISE EVIDENCE</text>
  <g filter="url(#shadow)">
    <rect x="42" y="373" width="380" height="164" rx="18" fill="#FFFFFF"/>
    <rect x="42" y="373" width="10" height="164" rx="5" fill="#2A9D8F"/>
  </g>
  <circle cx="91" cy="423" r="27" fill="#E1F3F0"/>
  <circle cx="80" cy="415" r="5" fill="#2A9D8F"/>
  <circle cx="102" cy="410" r="5" fill="#2A9D8F"/>
  <circle cx="105" cy="434" r="5" fill="#2A9D8F"/>
  <circle cx="81" cy="438" r="5" fill="#2A9D8F"/>
  <path d="M84 414 L98 411 M84 418 L101 431 M101 415 L104 429 M85 436 L100 434" fill="none" stroke="#2A9D8F" stroke-width="2.7" stroke-linecap="round"/>
  <text x="133" y="410" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Ground the attack evidence</text>
  <text x="133" y="438" fill="#5D6B7A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15.5">
    <tspan x="133" dy="0">Use external or separately implemented</tspan>
    <tspan x="133" dy="23">traces with observation error, topology,</tspan>
    <tspan x="133" dy="23">common-cause, and defense shifts.</tspan>
  </text>
  <rect x="72" y="494" width="284" height="28" rx="14" fill="#E1F3F0"/>
  <text x="214" y="513" text-anchor="middle" fill="#247F75" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.2" font-weight="700">EXTERNAL OR SEPARATE IMPLEMENTATION</text>

  <path d="M422 239 C470 239 470 305 505 327" fill="none" stroke="#8190A0" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M422 455 C470 455 470 389 505 367" fill="none" stroke="#8190A0" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <path d="M590 247 L687 347 L590 447 L493 347 Z" fill="#FFF4E8" stroke="#E67E22" stroke-width="4"/>
  </g>
  <circle cx="590" cy="306" r="22" fill="#FFE1C4"/>
  <path d="M579 306 L587 314 L602 296" fill="none" stroke="#C56513" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="590" y="346" text-anchor="middle" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Provenance</text>
  <text x="590" y="369" text-anchor="middle" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Authority</text>
  <text x="590" y="392" text-anchor="middle" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Quality</text>

  <line x1="687" y1="347" x2="742" y2="347" stroke="#8190A0" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="748" y="230" width="238" height="234" rx="18" fill="#FFFFFF"/>
    <rect x="748" y="230" width="238" height="10" rx="5" fill="#6C5AA7"/>
  </g>
  <circle cx="788" cy="282" r="24" fill="#EEEAF8"/>
  <rect x="778" y="277" width="20" height="16" rx="3" fill="none" stroke="#6C5AA7" stroke-width="3"/>
  <path d="M782 277 V272 A6 6 0 0 1 794 272 V277" fill="none" stroke="#6C5AA7" stroke-width="3" stroke-linecap="round"/>
  <text x="822" y="277" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Freeze a new study</text>
  <text x="776" y="331" fill="#5D6B7A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15.5">
    <tspan x="776" dy="0">New protocol and manifest</tspan>
    <tspan x="776" dy="25">New seed domains</tspan>
    <tspan x="776" dy="25">Fair comparators</tspan>
    <tspan x="776" dy="25">Fixed outcomes and criteria</tspan>
  </text>
  <rect x="776" y="416" width="164" height="30" rx="15" fill="#EEEAF8"/>
  <text x="858" y="436" text-anchor="middle" fill="#6C5AA7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">NO RETUNING</text>

  <line x1="986" y1="347" x2="1038" y2="347" stroke="#8190A0" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1044" y="230" width="238" height="234" rx="18" fill="#FFFFFF"/>
    <rect x="1044" y="230" width="238" height="10" rx="5" fill="#2E6F9E"/>
  </g>
  <circle cx="1084" cy="282" r="24" fill="#E6F0F7"/>
  <path d="M1073 288 L1084 276 L1095 288 M1073 276 H1095" fill="none" stroke="#2E6F9E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1118" y="277" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Test transfer</text>
  <text x="1072" y="331" fill="#5D6B7A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15.5">
    <tspan x="1072" dy="0">Prospective held-out campaign</tspan>
    <tspan x="1072" dy="25">Calibration and interval coverage</tspan>
    <tspan x="1072" dy="25">Unseen scale and topology</tspan>
    <tspan x="1072" dy="25">Capacity and workload shifts</tspan>
  </text>
  <rect x="1072" y="416" width="164" height="30" rx="15" fill="#E6F0F7"/>
  <text x="1154" y="436" text-anchor="middle" fill="#2E6F9E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">PROSPECTIVE</text>

  <line x1="1282" y1="347" x2="1334" y2="347" stroke="#8190A0" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1340" y="230" width="220" height="234" rx="18" fill="#FFFFFF"/>
    <rect x="1340" y="230" width="220" height="10" rx="5" fill="#E67E22"/>
  </g>
  <circle cx="1380" cy="282" r="24" fill="#FFF0E2"/>
  <path d="M1369 282 H1391 M1380 271 V293" stroke="#E67E22" stroke-width="3.5" stroke-linecap="round"/>
  <text x="1414" y="277" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">New disposition</text>
  <text x="1368" y="331" fill="#5D6B7A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15.5">
    <tspan x="1368" dy="0">Supported</tspan>
    <tspan x="1368" dy="25">Not supported</tspan>
    <tspan x="1368" dy="25">Not evaluable</tspan>
    <tspan x="1368" dy="33">All evidence retained</tspan>
  </text>
  <rect x="1368" y="416" width="160" height="30" rx="15" fill="#FFF0E2"/>
  <text x="1448" y="436" text-anchor="middle" fill="#C56513" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">EVIDENCE FIRST</text>

  <rect x="42" y="572" width="1518" height="62" rx="14" fill="#E9EFF4" stroke="#B9C6D2"/>
  <text x="67" y="598" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1">OUTCOMES THAT MATTER</text>
  <text x="67" y="620" fill="#526272" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Privilege-weighted loss  •  Mission degradation  •  Persistence  •  Recovery cost  •  Operator decision quality</text>

  <rect x="42" y="661" width="1518" height="63" rx="14" fill="#FFFFFF" stroke="#8190A0" stroke-width="2.5" stroke-dasharray="9 8"/>
  <circle cx="74" cy="692" r="12" fill="#17324D"/>
  <path d="M69 692 L73 696 L80 687" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="99" y="686" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Operational assurance remains a separate decision.</text>
  <text x="99" y="709" fill="#5D6B7A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Implementation-specific threat modeling, formal verification, adversarial testing, and operational test and evaluation are still required.</text>
</svg>

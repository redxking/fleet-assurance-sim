<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Successor-study evidence chain with target-free prediction commitment</title>
  <desc id="desc">Six numbered stages move from bound calibration evidence to a frozen version 1.1 registration, a target-free local prediction commitment, collection of a distinct future campaign, realized-input binding, and a still-blocked execution gate. A separate lower boundary lists independent timing, outcome custody, scoring, and authorization as unfinished.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#142F47"/>
      <stop offset="1" stop-color="#245A7A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17324D" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8796A5"/>
    </marker>
  </defs>

  <rect width="1600" height="720" rx="28" fill="#F4F7FA"/>
  <path d="M28 0 H1572 A28 28 0 0 1 1600 28 V122 H0 V28 A28 28 0 0 1 28 0 Z" fill="url(#header)"/>
  <text x="58" y="54" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Freeze semantics, commit predictions, then collect evidence</text>
  <text x="58" y="88" fill="#D7E6F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Protocol 1.1 keeps target-free construction separate from trusted timing, custody, scoring, and authority.</text>

  <rect x="28" y="143" width="1544" height="389" rx="22" fill="none" stroke="#B7C5D1" stroke-width="2" stroke-dasharray="9 8"/>
  <rect x="54" y="132" width="278" height="28" rx="14" fill="#F4F7FA"/>
  <text x="193" y="151" text-anchor="middle" fill="#526575" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">LOCAL, HASH-BOUND SOFTWARE CHAIN</text>

  <g stroke="#8796A5" stroke-width="4" marker-end="url(#arrow)">
    <line x1="272" y1="334" x2="298" y2="334"/>
    <line x1="532" y1="334" x2="558" y2="334"/>
    <line x1="792" y1="334" x2="818" y2="334"/>
    <line x1="1052" y1="334" x2="1078" y2="334"/>
    <line x1="1312" y1="334" x2="1338" y2="334"/>
  </g>

  <g filter="url(#shadow)"><rect x="42" y="179" width="230" height="326" rx="18" fill="#FFFFFF"/><rect x="42" y="179" width="230" height="9" rx="5" fill="#28897E"/></g>
  <circle cx="82" cy="226" r="23" fill="#E1F3F0"/><path d="M71 226 L79 234 L94 215" fill="none" stroke="#247F75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="245" y="221" text-anchor="end" fill="#7A8897" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">01</text>
  <text x="64" y="279" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="64">Bind calibration</tspan><tspan x="64" dy="27">and adapter</tspan></text>
  <text x="64" y="355" fill="#5D6B7A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14.5"><tspan x="64">Ten resource fits</tspan><tspan x="64" dy="23">Calibration-only estimates</tspan><tspan x="64" dy="23">No-fallback specifications</tspan></text>
  <rect x="64" y="456" width="130" height="29" rx="14" fill="#E1F3F0"/><text x="129" y="475" text-anchor="middle" fill="#247F75" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">VERIFIED INPUT</text>

  <g filter="url(#shadow)"><rect x="302" y="179" width="230" height="326" rx="18" fill="#FFFFFF"/><rect x="302" y="179" width="230" height="9" rx="5" fill="#6C5AA7"/></g>
  <circle cx="342" cy="226" r="23" fill="#EEEAF8"/><rect x="332" y="221" width="20" height="16" rx="3" fill="none" stroke="#6C5AA7" stroke-width="3"/><path d="M336 221 V216 A6 6 0 0 1 348 216 V221" fill="none" stroke="#6C5AA7" stroke-width="3" stroke-linecap="round"/>
  <text x="505" y="221" text-anchor="end" fill="#7A8897" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">02</text>
  <text x="324" y="279" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="324">Freeze protocol</tspan><tspan x="324" dy="27">version 1.1</tspan></text>
  <text x="324" y="355" fill="#5D6B7A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14.5"><tspan x="324">Candidate + comparator</tspan><tspan x="324" dy="23">Intervals + score rules</tspan><tspan x="324" dy="23">Exact future design</tspan></text>
  <rect x="324" y="456" width="134" height="29" rx="14" fill="#EEEAF8"/><text x="391" y="475" text-anchor="middle" fill="#6C5AA7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">REGISTRATION</text>

  <g filter="url(#shadow)"><rect x="562" y="179" width="230" height="326" rx="18" fill="#FFFFFF"/><rect x="562" y="179" width="230" height="9" rx="5" fill="#2E6F9E"/></g>
  <circle cx="602" cy="226" r="23" fill="#E6F0F7"/><path d="M591 228 H613 M595 219 H609 M598 237 H606" fill="none" stroke="#2E6F9E" stroke-width="3.3" stroke-linecap="round"/>
  <text x="765" y="221" text-anchor="end" fill="#7A8897" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">03</text>
  <text x="584" y="279" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="584">Commit target-free</tspan><tspan x="584" dy="27">prediction rows</tspan></text>
  <text x="584" y="355" fill="#5D6B7A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14.5"><tspan x="584">All blocks × resources</tspan><tspan x="584" dy="23">Paired bootstrap draws</tspan><tspan x="584" dy="23">No future campaign input</tspan></text>
  <rect x="584" y="456" width="156" height="29" rx="14" fill="#E6F0F7"/><text x="662" y="475" text-anchor="middle" fill="#2E6F9E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">LOCAL COMMITMENT</text>

  <g filter="url(#shadow)"><rect x="822" y="179" width="230" height="326" rx="18" fill="#FFFFFF"/><rect x="822" y="179" width="230" height="9" rx="5" fill="#3A799A"/></g>
  <circle cx="862" cy="226" r="23" fill="#E7F2F7"/><path d="M851 232 L862 219 L873 232 M851 218 H873" fill="none" stroke="#3A799A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1025" y="221" text-anchor="end" fill="#7A8897" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">04</text>
  <text x="844" y="279" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="844">Collect distinct</tspan><tspan x="844" dy="27">future evidence</tspan></text>
  <text x="844" y="355" fill="#5D6B7A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14.5"><tspan x="844">Registered campaign</tspan><tspan x="844" dy="23">Frozen blocks and timing</tspan><tspan x="844" dy="23">No plan revisions</tspan></text>
  <rect x="844" y="456" width="122" height="29" rx="14" fill="#E7F2F7"/><text x="905" y="475" text-anchor="middle" fill="#316B8A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">PROSPECTIVE</text>

  <g filter="url(#shadow)"><rect x="1082" y="179" width="230" height="326" rx="18" fill="#FFFFFF"/><rect x="1082" y="179" width="230" height="9" rx="5" fill="#D47722"/></g>
  <circle cx="1122" cy="226" r="23" fill="#FFF0E2"/><path d="M1111 217 H1133 M1111 226 H1129 M1111 235 H1125" stroke="#D47722" stroke-width="3.3" stroke-linecap="round"/>
  <text x="1285" y="221" text-anchor="end" fill="#7A8897" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">05</text>
  <text x="1104" y="279" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="1104">Bind realized</tspan><tspan x="1104" dy="27">evaluation inputs</tspan></text>
  <text x="1104" y="355" fill="#5D6B7A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14.5"><tspan x="1104">Registration + lock</tspan><tspan x="1104" dy="23">Exact design match</tspan><tspan x="1104" dy="23">Ten-resource coverage</tspan></text>
  <rect x="1104" y="456" width="142" height="29" rx="14" fill="#FFF0E2"/><text x="1175" y="475" text-anchor="middle" fill="#B95F12" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">INPUT BINDING</text>

  <g filter="url(#shadow)"><rect x="1342" y="179" width="216" height="326" rx="18" fill="#FFFFFF"/><rect x="1342" y="179" width="216" height="9" rx="5" fill="#7F8D9B"/></g>
  <circle cx="1382" cy="226" r="23" fill="#E9EFF4"/><rect x="1372" y="221" width="20" height="16" rx="3" fill="none" stroke="#526272" stroke-width="3"/><path d="M1376 221 V216 A6 6 0 0 1 1388 216 V221" fill="none" stroke="#526272" stroke-width="3" stroke-linecap="round"/>
  <text x="1531" y="221" text-anchor="end" fill="#7A8897" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">06</text>
  <text x="1364" y="279" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="1364">Execution stays</tspan><tspan x="1364" dy="27">locked</tspan></text>
  <text x="1364" y="355" fill="#5D6B7A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14.5"><tspan x="1364">No custody evidence</tspan><tspan x="1364" dy="23">No reviewed scorer</tspan><tspan x="1364" dy="23">No authorization</tspan></text>
  <rect x="1364" y="456" width="150" height="29" rx="14" fill="#E9EFF4"/><text x="1439" y="475" text-anchor="middle" fill="#526272" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">NOT AUTHORIZED</text>

  <rect x="42" y="565" width="1516" height="112" rx="18" fill="#FFFFFF" stroke="#B7C5D1" stroke-width="2"/>
  <circle cx="84" cy="621" r="17" fill="#D7A349"/><path d="M84 610 V624 M84 632 V633" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
  <text x="116" y="607" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Still required outside the local chain</text>
  <text x="116" y="637" fill="#5D6B7A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15.5">Independent prediction receipt or timestamp  •  outcome-release custody  •  reviewed one-shot scorer and result package  •  separate execution authorization</text>
  <text x="116" y="661" fill="#7A4D12" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="600">A local digest proves integrity. It does not prove real-world timing, custody, scientific support, external validation, or deployment readiness.</text>
</svg>

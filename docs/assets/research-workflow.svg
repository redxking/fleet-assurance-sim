<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Fleet Assurance Simulation research workflow</title>
  <desc id="desc">Five-stage workflow moving from a bounded research question through protocol freeze, synthetic execution, held-out evaluation, and immutable evidence.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17324D" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17324D"/>
      <stop offset="1" stop-color="#245377"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A98A8"/>
    </marker>
  </defs>

  <rect width="1600" height="620" rx="28" fill="#F5F8FB"/>
  <path d="M28 0 H1572 A28 28 0 0 1 1600 28 V112 H0 V28 A28 28 0 0 1 28 0 Z" fill="url(#header)"/>
  <text x="64" y="54" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">From a research question to reviewable evidence</text>
  <text x="64" y="86" fill="#D9E8F2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Complexity earns no credit by itself. A candidate has to survive a frozen, held-out test.</text>

  <line x1="290" y1="324" x2="342" y2="324" stroke="#8A98A8" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="598" y1="324" x2="650" y2="324" stroke="#8A98A8" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="906" y1="324" x2="958" y2="324" stroke="#8A98A8" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1214" y1="324" x2="1266" y2="324" stroke="#8A98A8" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="40" y="152" width="250" height="344" rx="18" fill="#FFFFFF"/>
    <rect x="40" y="152" width="250" height="10" rx="5" fill="#2E6F9E"/>
  </g>
  <circle cx="86" cy="205" r="27" fill="#E6F0F7"/>
  <circle cx="86" cy="205" r="15" fill="none" stroke="#2E6F9E" stroke-width="4"/>
  <circle cx="86" cy="205" r="5" fill="#2E6F9E"/>
  <path d="M86 177 V186 M86 224 V233 M58 205 H67 M105 205 H114" stroke="#2E6F9E" stroke-width="3" stroke-linecap="round"/>
  <text x="256" y="199" text-anchor="end" fill="#7A8897" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">01</text>
  <text x="68" y="266" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Frame the question</text>
  <text x="68" y="304" fill="#5D6B7A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">
    <tspan x="68" dy="0">State the system boundary,</tspan>
    <tspan x="68" dy="25">assumptions, candidate,</tspan>
    <tspan x="68" dy="25">comparators, and outcomes.</tspan>
  </text>
  <rect x="68" y="421" width="148" height="34" rx="17" fill="#E6F0F7"/>
  <text x="142" y="443" text-anchor="middle" fill="#2E6F9E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">BOUNDED CLAIM</text>

  <g filter="url(#shadow)">
    <rect x="348" y="152" width="250" height="344" rx="18" fill="#FFFFFF"/>
    <rect x="348" y="152" width="250" height="10" rx="5" fill="#6C5AA7"/>
  </g>
  <circle cx="394" cy="205" r="27" fill="#EEEAF8"/>
  <rect x="382" y="199" width="24" height="19" rx="4" fill="none" stroke="#6C5AA7" stroke-width="3.5"/>
  <path d="M387 199 V192 A7 7 0 0 1 401 192 V199" fill="none" stroke="#6C5AA7" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="394" cy="208" r="2.7" fill="#6C5AA7"/>
  <path d="M394 210 V214" stroke="#6C5AA7" stroke-width="2.5" stroke-linecap="round"/>
  <text x="564" y="199" text-anchor="end" fill="#7A8897" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">02</text>
  <text x="376" y="266" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Freeze the study</text>
  <text x="376" y="304" fill="#5D6B7A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">
    <tspan x="376" dy="0">Bind code, environment,</tspan>
    <tspan x="376" dy="25">partitions, seeds, thresholds,</tspan>
    <tspan x="376" dy="25">and acceptance rules.</tspan>
  </text>
  <rect x="376" y="421" width="166" height="34" rx="17" fill="#EEEAF8"/>
  <text x="459" y="443" text-anchor="middle" fill="#6C5AA7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HASH-BOUND</text>

  <g filter="url(#shadow)">
    <rect x="656" y="152" width="250" height="344" rx="18" fill="#FFFFFF"/>
    <rect x="656" y="152" width="250" height="10" rx="5" fill="#2A9D8F"/>
  </g>
  <circle cx="702" cy="205" r="27" fill="#E1F3F0"/>
  <circle cx="692" cy="195" r="5" fill="#2A9D8F"/>
  <circle cx="714" cy="194" r="5" fill="#2A9D8F"/>
  <circle cx="701" cy="216" r="5" fill="#2A9D8F"/>
  <circle cx="719" cy="216" r="5" fill="#2A9D8F"/>
  <path d="M696 197 L710 195 M695 199 L699 211 M711 198 L704 212 M716 199 L718 211 M706 216 H714" fill="none" stroke="#2A9D8F" stroke-width="2.7" stroke-linecap="round"/>
  <text x="872" y="199" text-anchor="end" fill="#7A8897" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">03</text>
  <text x="684" y="266" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Execute scenarios</text>
  <text x="684" y="304" fill="#5D6B7A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">
    <tspan x="684" dy="0">Run synthetic fleet, resource,</tspan>
    <tspan x="684" dy="25">network, attack, and defense</tspan>
    <tspan x="684" dy="25">conditions reproducibly.</tspan>
  </text>
  <rect x="684" y="421" width="166" height="34" rx="17" fill="#E1F3F0"/>
  <text x="767" y="443" text-anchor="middle" fill="#247F75" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">REPLAYABLE</text>

  <g filter="url(#shadow)">
    <rect x="964" y="152" width="250" height="344" rx="18" fill="#FFFFFF"/>
    <rect x="964" y="152" width="250" height="10" rx="5" fill="#E67E22"/>
  </g>
  <circle cx="1010" cy="205" r="27" fill="#FFF0E2"/>
  <path d="M997 193 H1021 M997 202 H1016 M997 211 H1011" stroke="#E67E22" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M1016 212 L1021 217 L1029 207" fill="none" stroke="#E67E22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1180" y="199" text-anchor="end" fill="#7A8897" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">04</text>
  <text x="992" y="266" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Test what was held out</text>
  <text x="992" y="304" fill="#5D6B7A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">
    <tspan x="992" dy="0">Compare candidates fairly and</tspan>
    <tspan x="992" dy="25">apply every preregistered</tspan>
    <tspan x="992" dy="25">criterion, including failures.</tspan>
  </text>
  <rect x="992" y="421" width="166" height="34" rx="17" fill="#FFF0E2"/>
  <text x="1075" y="443" text-anchor="middle" fill="#C56513" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">NO RETUNING</text>

  <g filter="url(#shadow)">
    <rect x="1272" y="152" width="288" height="344" rx="18" fill="#FFFFFF"/>
    <rect x="1272" y="152" width="288" height="10" rx="5" fill="#17324D"/>
  </g>
  <circle cx="1318" cy="205" r="27" fill="#E5ECF2"/>
  <path d="M1305 194 H1331 V218 H1305 Z" fill="none" stroke="#17324D" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M1310 188 H1326 V196 H1310 Z" fill="#E5ECF2" stroke="#17324D" stroke-width="3"/>
  <path d="M1312 207 L1317 212 L1326 202" fill="none" stroke="#2A9D8F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1526" y="199" text-anchor="end" fill="#7A8897" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">05</text>
  <text x="1300" y="266" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Preserve the decision</text>
  <text x="1300" y="304" fill="#5D6B7A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">
    <tspan x="1300" dy="0">Publish evidence, manifests,</tspan>
    <tspan x="1300" dy="25">reports, figures, and negative</tspan>
    <tspan x="1300" dy="25">results for independent review.</tspan>
  </text>
  <rect x="1300" y="421" width="194" height="34" rx="17" fill="#E5ECF2"/>
  <text x="1397" y="443" text-anchor="middle" fill="#17324D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">IMMUTABLE RECORD</text>

  <rect x="40" y="530" width="1520" height="54" rx="14" fill="#17324D"/>
  <circle cx="73" cy="557" r="10" fill="#2A9D8F"/>
  <text x="98" y="563" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Decision rule:</text>
  <text x="224" y="563" fill="#D9E8F2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">execution integrity can pass while a scientific hypothesis fails, and both facts are preserved.</text>
</svg>

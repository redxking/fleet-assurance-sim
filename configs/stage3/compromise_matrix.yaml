  confirmatory: 10
outbreak_threshold_fraction: 0.10
initiation_estimators:
  - static_spectral_radius
  - static_nonbacktracking
  - temporal_propagator
  - dynamic_message_passing
  - node_hazard_aggregation
  - calibrated_logistic
severity_estimators:
  - reachable_component_fraction
  - directed_percolation
  - message_passing_final_size
  - interpretable_statistical
  - simulation_derived_conditional_severity
primary_model:
  type: phase_separated
  initiation: dynamic_message_passing
  severity: message_passing_final_size
acceptance:
  minimum_final_size_mae_improvement_fraction: 0.15
  minimum_outbreak_brier_improvement_fraction: 0.10

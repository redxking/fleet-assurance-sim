  bootstrap_improvement_lower_bound_greater_than: 0.0
  require_unseen_topology_transfer: true
  require_unseen_scale_transfer: true
  minimum_transfer_mae_improvement_fraction: 0.0
  require_paired_defense_scenarios: true
  maximum_calibration_slope_shift: 0.20
  generator_predictor_latent_equation_overlap: prohibited
